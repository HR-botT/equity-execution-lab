[project]
name = "equity-execution-lab"
version = "0.1.0"
description = "Event-driven simulation platform for US equity execution algorithms and Smart Order Routing"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "flake8>=6.1", "black>=23.11", "isort>=5.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]